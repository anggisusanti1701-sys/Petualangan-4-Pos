<html lang="id"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan 4 Pos Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="index_files/css2_JWqi.css" rel="stylesheet"><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2740;--mut:#5b6785;--line:#dde3f0;--blue:#2f5fd0;--orange:#ef7a2b;--green:#3f9f4d;--okbg:#e1f4e6;--ok:#2e9e55;--badbg:#fbe4e4;--bad:#d44a4a;--tint:#fff3e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a2e;--card:#1b2542;--ink:#eef2ff;--mut:#a9b4d4;--line:#2d3a63;--okbg:#173a28;--badbg:#472327;--tint:#33283a}}
:root[data-theme="dark"]{--bg:#111a2e;--card:#1b2542;--ink:#eef2ff;--mut:#a9b4d4;--line:#2d3a63;--okbg:#173a28;--badbg:#472327;--tint:#33283a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 clamp(16px,1.5vw,21px)/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
#app{min-height:100%;max-width:1280px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h1,h2,.big,.pin,.wheel{font-family:Fredoka,"Plus Jakarta Sans",system-ui,sans-serif}
h1{margin:0;font-size:clamp(22px,2.6vw,34px);line-height:1.1;color:var(--blue)}
h1 small{display:block;font-size:.5em;color:var(--orange);font-weight:600}
h2{margin:0 0 8px;font-size:clamp(22px,2.4vw,32px)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.teams{display:flex;flex-wrap:wrap;gap:8px}
.team{background:var(--card);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:14px;padding:6px 14px;min-width:110px}
.team b{display:block;font-size:.8em;color:var(--mut)}
.team span{font:700 1.5em/1.1 Fredoka,sans-serif}
.team.on{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(16px,2.4vw,32px);flex:1}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--mut);margin-bottom:10px}
.mut{color:var(--mut)}
.btn{min-height:56px;padding:10px 26px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:700 1em "Plus Jakarta Sans",sans-serif;cursor:pointer;margin-top:14px}
.btn.alt{background:var(--orange)}
.btn.line{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
.road{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 8px}
.road::before{content:"";position:absolute;left:6%;right:6%;top:40px;height:14px;border-radius:9px;background:var(--orange);opacity:.35}
.stn{position:relative;background:none;border:0;color:inherit;font:inherit;text-align:center;cursor:pointer;padding:0 6px}
.stn b{display:block;font-size:1.15em}
.stn small{display:block;color:var(--mut);font-weight:600}
.pin{display:grid;place-items:center;width:86px;height:86px;margin:0 auto 10px;border-radius:50%;background:var(--c);color:#fff;font-size:2.2em;font-weight:700;border:6px solid var(--card);box-shadow:0 0 0 3px var(--c)}
.stn:hover .pin{transform:scale(1.07)}
.stn.done{cursor:default}.stn.done .pin{background:var(--ok);box-shadow:0 0 0 3px var(--ok)}.stn.done:hover .pin{transform:none}
.big{font-size:clamp(24px,3vw,40px);font-weight:600;line-height:1.25;margin:18px 0 22px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--orange);transition:width .25s linear}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{min-height:72px;padding:12px 16px;border:3px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);font:700 1.1em "Plus Jakarta Sans",sans-serif;cursor:pointer}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:16px;padding:14px 18px;border-radius:16px}
.fb.good{background:var(--okbg)}.fb.miss{background:var(--badbg)}
.wheel{display:grid;place-items:center;width:min(100%,360px);height:110px;margin:8px auto 0;border-radius:24px;background:var(--tint);border:3px dashed var(--orange);font-size:2.6em;font-weight:700;color:var(--orange)}
.center{text-align:center}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.card{border:2px solid var(--line);border-radius:18px;padding:12px 16px;background:var(--bg)}
.card b{display:block;color:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:2px solid var(--line)}
.stars button{border:0;background:none;font-size:2.1em;line-height:1;color:var(--orange);cursor:pointer;padding:2px 4px}
.cd{font:700 2em Fredoka,sans-serif;color:var(--blue)}
.rank{display:flex;align-items:center;gap:14px;padding:10px 16px;margin-bottom:8px;border-radius:16px;background:var(--bg);border-left:10px solid var(--c)}
.rank .no{font:700 1.8em Fredoka,sans-serif;width:1.6em}
.rank .sc{margin-left:auto;font:700 1.6em Fredoka,sans-serif}
.rank:first-child{background:var(--tint)}
input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;margin-top:8px}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.cnt .btn{margin:0;min-width:56px;padding:8px 14px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
@media (max-width:700px){.road{grid-template-columns:1fr 1fr;row-gap:22px}.road::before{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;margin:8px 0;resize:vertical}
.lb{display:grid;gap:8px;margin-top:12px}
.lbr{display:grid;grid-template-columns:2em 1fr auto 3em;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:var(--bg);border-left:8px solid var(--c);font-size:1.1em}
.lbr b:last-child{text-align:right;font:700 1.5em Fredoka,sans-serif}
.lbr.idle{opacity:.5}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);margin-left:5px}.dots i.on{background:var(--ok)}
.code{font:700 clamp(40px,8vw,96px)/1.1 Fredoka,sans-serif;color:var(--orange);letter-spacing:.06em}
.stat{display:flex;gap:12px;flex-wrap:wrap}.stat .card{flex:1;min-width:140px}
.gs{font:700 2.2em Fredoka,sans-serif;margin-right:6px}
.win{background:var(--tint);border-color:var(--orange)}.trophy{font-size:3.2em;line-height:1}
</style>
</head>
<body>
<div id="app"><header class="top"><h1>Petualangan 4 Pos<small>Misi Penyelamatan Karier</small></h1></header><section class="panel"><h2>Gabung kelas</h2><b>Kode kelas</b><input id="kd" inputmode="numeric" maxlength="8" placeholder="Kode di papan guru"><b style="display:block;margin-top:12px">Kelompokmu</b><div class="cnt"><button class="btn gb line" style="min-width:64px" onclick="setG(1)">1</button><button class="btn gb line" style="min-width:64px" onclick="setG(2)">2</button><button class="btn gb line" style="min-width:64px" onclick="setG(3)">3</button><button class="btn gb line" style="min-width:64px" onclick="setG(4)">4</button></div><b>Namamu</b><input id="nm" maxlength="20" placeholder="Nama panggilan"><div id="er" class="mut"></div><button class="btn alt" onclick="join()">Masuk</button></section></div>
<script>
var $=function(s){return document.querySelector(s)},app=$('#app');
var SB_URL='https://abcd1234.supabase.co',SB_KEY='sb_publishable_xxxxxxxx';
var TC=['#2f5fd0','#ef7a2b','#3f9f4d','#8a56d6','#d6407a','#1d9fb5'],PC=['#2f5fd0','#ef7a2b','#3f9f4d','#2f5fd0'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ST=[
{n:'Kenali Diri',g:'Tebak Modal Karier',o:['Minat','Kemampuan','Nilai Diri'],q:[
['Aku betah berjam-jam mengutak-atik mesin motor karena seru banget.',0,'Hal yang membuatmu tertarik dan betah disebut minat.'],
['Aku bisa mengoperasikan aplikasi desain dengan lancar.',1,'Sesuatu yang sudah bisa kamu lakukan atau pelajari dengan baik adalah kemampuan.'],
['Bagiku, pekerjaan itu harus bisa membantu orang lain.',2,'Hal yang kamu anggap penting saat memilih pekerjaan adalah nilai diri.'],
['Aku selalu penasaran dengan dunia kuliner dan resep baru.',0,'Rasa penasaran dan ketertarikan pada suatu bidang menunjukkan minat.'],
['Aku terbiasa mengolah data sederhana di spreadsheet.',1,'Mengolah data adalah kemampuan yang bisa kamu tunjukkan.'],
['Aku ingin pekerjaan yang membuatku terus berkembang.',2,'Keinginan berkembang adalah nilai diri yang memengaruhi pilihan karier.']]},
{n:'Kenali Peluang',g:'Jalur Mana?',o:['Bekerja','Kuliah','Berwirausaha','Pelatihan'],q:[
['Rina menyiapkan CV dan portofolio, lalu melamar ke bengkel resmi.',0,'Langkah awal untuk bekerja adalah menyiapkan CV dan portofolio.'],
['Dimas meriset jurusan dan biaya kuliah teknik mesin.',1,'Riset jurusan dan biaya adalah langkah awal untuk kuliah.'],
['Salsa membuat prototipe tas dari bahan daur ulang untuk dijual.',2,'Membuat purwarupa produk adalah langkah awal berwirausaha.'],
['Bayu mencari lembaga sertifikasi untuk kompetensi las.',3,'Mencari lembaga sertifikasi adalah langkah awal mengikuti pelatihan.'],
['Ega ingin cepat punya pengalaman kerja dan penghasilan sendiri.',0,'Fokus utama jalur bekerja adalah pengalaman dan penghasilan.'],
['Tari punya ide kue kekinian dan berani mengambil risiko untuk memulainya.',2,'Berani mengambil risiko dan kreatif adalah karakter ideal wirausaha.']]},
{n:'Siapkan Diri',g:'Isi Ransel Keterampilan',o:['Komunikasi','Pemecahan Masalah','Disiplin dan Tanggung Jawab','Literasi Digital'],q:[
['Kamu harus menjelaskan idemu kepada calon pelanggan.',0,'Menyampaikan ide dengan jelas membutuhkan komunikasi.'],
['Mesin di tempat PKL tiba-tiba mati dan kamu harus mencari penyebabnya.',1,'Menganalisis situasi dan mencari solusi adalah pemecahan masalah.'],
['Kamu sudah berjanji menyelesaikan pesanan besok pagi.',2,'Menjaga komitmen adalah disiplin dan tanggung jawab.'],
['Kamu ingin mempromosikan produk lewat media sosial dengan aman.',3,'Memakai teknologi secara cerdas, aman, dan produktif adalah literasi digital.'],
['Timmu berbeda pendapat saat membagi tugas projek.',0,'Mendengarkan dan bekerja sama membutuhkan komunikasi.'],
['Laporan PKL harus selesai tepat waktu padahal jadwalmu padat.',2,'Mengelola waktu dan menyelesaikan tugas adalah disiplin dan tanggung jawab.']]},
{n:'Buat Langkah',g:'Misi Penyelamatan Karier'}];
var CH=[['Rian','Ingin bekerja setelah lulus.','Belum percaya diri menghadapi wawancara kerja.'],
['Sinta','Mengembangkan produk kreatif.','Terampil membuat produk, tetapi belum berani memulai usaha.'],
['Doni','Melanjutkan pendidikan.','Semangat tinggi, tetapi bingung memilih jurusan dan buta informasi biaya.']];
var STEPS=[['Masalah utama','Apa tantangan yang dihadapi tokoh?'],['Potensi diri','Kekuatan apa yang dapat dia gunakan?'],['Kebutuhan skill','Keterampilan atau informasi apa yang masih dibutuhkan?'],['Langkah realistis','Apa SATU langkah awal yang bisa dilakukan besok?']];
var S=null,B=null,G=0,tm=null,pl=null,cur={};
function api(p,o){o=o||{};var h={apikey:SB_KEY,'Content-Type':'application/json'};if(SB_KEY.indexOf('eyJ')===0)h.Authorization='Bearer '+SB_KEY;
  for(var k in (o.headers||{}))h[k]=o.headers[k];o.headers=h;
  return fetch(SB_URL+'/rest/v1/'+p,o).then(function(r){if(!r.ok)throw new Error(r.status);return r.text().then(function(t){return t?JSON.parse(t):null})})}
function ld(){try{return JSON.parse(localStorage.getItem('p4p'))}catch(e){return null}}
function sv(){try{localStorage.setItem('p4p',JSON.stringify(S))}catch(e){}}
function hdr(r){return '<header class="top"><h1>Petualangan 4 Pos<small>Misi Penyelamatan Karier</small></h1>'+r+'</header>'}
function chip(){return '<div class="teams"><div class="team" style="--c:'+TC[S.kelompok-1]+'"><b>'+esc(S.nama)+', Kel. '+S.kelompok+'</b><span id="sk">'+S.skor+'</span></div></div>'}
function net(ok){var e=$('#net');if(e)e.textContent=B?(ok?'Terhubung. Diperbarui otomatis.':'Koneksi bermasalah, mencoba lagi.'):(ok?'Skor terkirim ke guru.':'Koneksi bermasalah. Skor dikirim ulang pada jawaban berikutnya.')}

function home(){clearInterval(tm);clearInterval(pl);var r=ld();
  app.innerHTML=hdr('')+'<section class="panel"><h2>Mulai sebagai</h2><div class="opts"><button class="opt" onclick="joinForm()">Siswa mulai bermain</button><button class="opt" onclick="boardForm()">Guru memantau</button></div>'+(r?'<button class="btn alt" onclick="S=ld();menu()">Lanjutkan sebagai '+esc(r.nama)+'</button>':'')+'</section>'}
function joinForm(){G=0;app.innerHTML=hdr('')+'<section class="panel"><h2>Gabung kelas</h2><b>Kode kelas</b><input id="kd" inputmode="numeric" maxlength="8" placeholder="Kode di papan guru"><b style="display:block;margin-top:12px">Kelompokmu</b><div class="cnt">'+[1,2,3,4].map(function(n){return '<button class="btn gb line" style="min-width:64px" onclick="setG('+n+')">'+n+'</button>'}).join('')+'</div><b>Namamu</b><input id="nm" maxlength="20" placeholder="Nama panggilan"><div id="er" class="mut"></div><button class="btn alt" onclick="join()">Masuk</button></section>'}
function setG(n){G=n;document.querySelectorAll('.gb').forEach(function(b,i){b.className='btn gb'+(i===n-1?'':' line')})}
function join(){var k=$('#kd').value.trim(),n=$('#nm').value.trim();
  if(!G||!n||(SB_URL&&!k)){$('#er').textContent='Pilih kelompok, isi kode kelas, dan namamu.';return}
  S={kelas:k||'solo',id:Math.random().toString(36).slice(2,10),nama:n,kelompok:G,skor:0,benar:0,jawab:0,done:[0,0,0,0],langkah:''};sv();menu()}

function menu(){clearInterval(tm);var all=S.done.every(Boolean);sync();
  app.innerHTML=hdr(chip())+'<section class="panel"><h2>'+(all?'Petualangan selesai!':'Pilih pos')+'</h2><p class="mut">'+(all?'Skor akhirmu '+S.skor+'. Skormu sudah masuk ke kelompok. Lihat pemenang di papan guru.':'Selesaikan keempat pos. Jawaban benar bernilai 10 poin.')+'</p><div class="road">'+ST.map(function(s,i){return '<button class="stn'+(S.done[i]?' done':'')+'" '+(S.done[i]?'disabled':'onclick="go('+i+')"')+' style="--c:'+PC[i]+'"><span class="pin">'+(S.done[i]?'✓':i+1)+'</span><b>'+s.n+'</b><small>'+s.g+'</small></button>'}).join('')+'</div><div id="net" class="mut"></div></section>'}
function go(i){i===3?mission():quiz(i,0)}

function quiz(si,i){clearInterval(tm);var s=ST[si];
  if(i>=s.q.length){S.done[si]=1;sv();return menu()}
  cur={si:si,i:i,done:0};var left=20;
  app.innerHTML=hdr(chip())+'<section class="panel"><div class="meta"><span>Pos '+(si+1)+': '+s.g+'</span><span>'+(i+1)+'/'+s.q.length+'</span></div><div class="bar"><i id="bi"></i></div><p class="big">'+s.q[i][0]+'</p><div class="opts">'+s.o.map(function(o,k){return '<button class="opt" onclick="pick('+k+')">'+o+'</button>'}).join('')+'</div><div id="fb"></div></section>';
  tm=setInterval(function(){left-=.25;$('#bi').style.width=Math.max(left,0)/20*100+'%';if(left<=0)pick(-1)},250)}
function pick(k){
  if(cur.done)return;cur.done=1;clearInterval(tm);
  var it=ST[cur.si].q[cur.i],ok=k===it[1];S.jawab++;if(ok){S.skor+=10;S.benar++}sv();sync();
  document.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(j===it[1])b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  $('#fb').innerHTML='<div class="fb '+(ok?'good':'miss')+'"><b>'+(k<0?'Waktu habis.':ok?'Benar! +10 poin.':'Belum tepat.')+'</b> '+it[2]+'</div><button class="btn" onclick="quiz('+cur.si+','+(cur.i+1)+')">Lanjut</button><div id="net" class="mut"></div>';
  $('#sk').textContent=S.skor}

function mission(){clearInterval(tm);var c=CH[parseInt(S.id,36)%3];
  app.innerHTML=hdr(chip())+'<section class="panel"><div class="meta"><span>Pos 4: Misi Penyelamatan Karier</span></div><h2>Bantu '+c[0]+'</h2><div class="chars"><div class="card"><b>Target</b>'+c[1]+'</div><div class="card"><b>Kendala</b>'+c[2]+'</div></div><p class="mut">Pikirkan dulu: '+STEPS.slice(0,3).map(function(s){return s[1]}).join(' ')+'</p><b>'+STEPS[3][1]+'</b><textarea id="lg" maxlength="140" rows="3" placeholder="Tulis satu langkah kecil yang bisa dilakukan besok"></textarea><div id="er" class="mut"></div><button class="btn alt" onclick="sendM()">Kirim jawaban (+20 poin)</button></section>'}
function sendM(){var t=$('#lg').value.trim();
  if(t.length<15){$('#er').textContent='Tulis minimal 15 karakter agar langkahnya jelas.';return}
  S.langkah=t;S.skor+=20;S.done[3]=1;sv();menu()}

function sync(){if(!SB_URL||!S)return;
  api('players?on_conflict=kelas,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({kelas:S.kelas,id:S.id,nama:S.nama,kelompok:S.kelompok,skor:S.skor,benar:S.benar,jawab:S.jawab,pos:S.done.filter(Boolean).length,langkah:S.langkah,updated:new Date().toISOString()})}).then(function(){net(1)}).catch(function(){net(0)})}

function boardForm(){var k=String(1000+Math.floor(Math.random()*9000));
  app.innerHTML=hdr('')+'<section class="panel"><h2>Papan guru</h2><p class="mut">Bagikan kode kelas ini kepada siswa. Ubah bila perlu.</p><input id="kd" value="'+k+'" inputmode="numeric" maxlength="8"><button class="btn alt" onclick="board($(\'#kd\').value.trim())">Buka papan</button>'+(SB_URL?'':'<p class="fb miss">Pemantauan belum aktif: isi SB_URL dan SB_KEY di bagian atas file.</p>')+'</section>'}
function board(k){if(!k)return;B={k:k,rows:[],show:0};clearInterval(pl);
  app.innerHTML=hdr('')+'<section class="panel center"><p class="mut">Siswa buka tautan ini di HP, pilih Siswa mulai bermain, lalu masukkan kode</p><b>'+esc(location.href.split('#')[0])+'</b><div class="code">'+esc(k)+'</div></section><div id="wn"></div><section class="panel"><h2>Skor kelompok</h2><div class="chars" id="gp"></div><div class="stat" id="st"></div></section><section class="panel"><h2>Peringkat siswa</h2><div class="lb" id="lb"></div></section><section class="panel"><h2>Langkah realistis siswa</h2><div class="chars" id="fd"></div><button class="btn alt" onclick="B.show=1;draw(B.rows)">Umumkan pemenang</button> <button class="btn line" onclick="csv()">Unduh rekap (CSV)</button> <span id="net" class="mut"></span></section>';
  pl=setInterval(tick,2500);tick()}
function tick(){
  if(!SB_URL){$('#lb').innerHTML='<p class="fb miss">Pemantauan belum aktif: isi SB_URL dan SB_KEY di bagian atas file.</p>';return}
  api('players?kelas=eq.'+encodeURIComponent(B.k)+'&select=*&order=skor.desc,updated.desc').then(function(r){draw(r||[]);net(1)}).catch(function(){net(0)})}
function draw(rows){B.rows=rows;var now=Date.now(),n=rows.length,fin=0,g=[0,1,2,3].map(function(){return{s:0,n:0,f:0}});
  rows.forEach(function(r){var i=(r.kelompok||1)-1;if(i<0||i>3)i=0;g[i].s+=r.skor;g[i].n++;if(r.pos>=4){g[i].f++;fin++}});
  $('#gp').innerHTML=g.map(function(x,i){return '<div class="card" style="border-left:10px solid '+TC[i]+'"><b>Kelompok '+(i+1)+'</b><span class="gs">'+x.s+'</span> poin<br><small class="mut">'+x.n+' siswa, '+x.f+' selesai</small></div>'}).join('');
  $('#st').innerHTML='<div class="card"><b>Peserta</b>'+n+'</div><div class="card"><b>Selesai</b>'+fin+' dari '+n+'</div>';
  $('#lb').innerHTML=rows.map(function(r,i){var idle=r.pos<4&&now-new Date(r.updated)>30000;
    return '<div class="lbr'+(idle?' idle':'')+'" style="--c:'+TC[((r.kelompok||1)-1)%6]+'"><b>'+(i+1)+'</b><span>'+esc(r.nama)+' <small class="mut">Kel. '+esc(r.kelompok||1)+'</small></span><span class="dots">'+[0,1,2,3].map(function(j){return '<i class="'+(j<r.pos?'on':'')+'"></i>'}).join('')+'</span><b>'+r.skor+'</b></div>'}).join('')||'<p class="mut">Menunggu siswa bergabung...</p>';
  $('#fd').innerHTML=rows.filter(function(r){return r.langkah}).slice(0,12).map(function(r){return '<div class="card"><b>'+esc(r.nama)+'</b>'+esc(r.langkah)+'</div>'}).join('');
  var all=n>0&&fin===n;
  if(all||B.show){var m=-1,w=[];g.forEach(function(x,i){if(!x.n)return;if(x.s>m){m=x.s;w=[i+1]}else if(x.s===m)w.push(i+1)});
    $('#wn').innerHTML=w.length?'<section class="panel win center"><div class="trophy">🏆</div><h2>'+(all?'Permainan selesai!':'Pengumuman pemenang')+'</h2><p class="mut">'+(w.length>1?'Seri antara':'Pemenangnya')+'</p><div class="code">'+w.map(function(i){return 'Kelompok '+i}).join(' dan ')+'</div><p>dengan '+m+' poin</p></section>':''}
  else $('#wn').innerHTML=''}
function csv(){var q=function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  var t='kelompok,nama,skor,benar,jawab,pos_selesai,langkah\n'+B.rows.map(function(r){return [r.kelompok,r.nama,r.skor,r.benar,r.jawab,r.pos,r.langkah].map(q).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='rekap-kelas-'+B.k+'.csv';a.click()}
if(location.hash==='#guru')boardForm();else home();
